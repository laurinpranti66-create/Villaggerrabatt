name: VillagerRabatt
version: '1.0.0'
main: de.playground.villagerrabatt.VillagerRabattPlugin
api-version: '1.21'
author: PlayGround
description: Geheilte Zombie-Villager geben dauerhaft allen Spielern Rabatt auf ihre Emerald-Kaufpreise.

commands:
  villagerrabatt:
    description: Verwaltung des Villager-Rabatt-Systems.
    usage: '&cNutzung: &7/vrabatt markall [radius|world] &8| &7/vrabatt reload'
    permission: playground.villagerrabatt.admin
    aliases: [vrabatt]

permissions:
  playground.villagerrabatt.admin:
    description: Erlaubt die Nutzung von /vrabatt (rückwirkendes Markieren, Reload).
    default: op
